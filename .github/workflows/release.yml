name: Publish Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'headlessj4ger/codex-usage-monitor'
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - run: node bin/codex-usage-monitor.cjs install-runtime
      - run: ./scripts/test.ps1
      - run: ./scripts/package.ps1
      - run: ./scripts/verify-package.ps1
      - run: ./scripts/package-npm.ps1
      - run: ./scripts/test-npm.ps1
      - name: Upload complete runtime packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          $tag='v'+$version
          if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $tag){throw 'Tag and package versions differ'}
          $zip="outputs/CodexUsageMonitor-$version-win-x64.zip"
          $tgz="outputs/codex-usage-monitor-$version.tgz"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){throw 'This release already exists; publish a new version instead of replacing it'}
          gh release create $tag $zip ($zip.Replace('.zip','.sha256')) $tgz ($tgz+'.sha256') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Codex Usage Monitor $version" --notes-file CHANGELOG.md --draft
          if($LASTEXITCODE -ne 0){throw 'Release upload failed; inspect any draft before retrying'}
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
