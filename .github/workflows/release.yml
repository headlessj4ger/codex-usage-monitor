name: Prepare signed Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'headlessj4ger/codex-usage-monitor' && github.ref == 'refs/heads/main'
    environment: windows-signing
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - run: node bin/codex-usage-monitor.cjs install-runtime
      - run: ./scripts/test.ps1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/publish-native.ps1
      - name: Upload project binaries for signing
        uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: unsigned-project-binaries
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/native-publish/CodexUsageMonitor.exe
            .build/native-publish/CodexUsageMonitor.dll
      - name: Request an approved production signature
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: .build/signed
      - name: Verify and stage signed binaries
        env:
          SIGNER_THUMBPRINT: ${{ vars.SIGNER_THUMBPRINT }}
        run: ./scripts/verify-native-signatures.ps1 -SignedDirectory .build/signed -SignerThumbprint $env:SIGNER_THUMBPRINT -Stage
      - run: ./scripts/package.ps1
      - run: ./scripts/verify-package.ps1
      - run: ./scripts/package-npm.ps1
      - run: ./scripts/test-npm.ps1
      - run: ./scripts/test-startup.ps1
      - run: ./scripts/test-startup.ps1 -Npm
      - run: ./scripts/test.ps1 -Ui
      - name: Upload signed runtime packages to a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          $tag='v'+$version
          if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $tag){throw 'Tag and package versions differ'}
          $zip="outputs/CodexUsageMonitor-$version-win-x64.zip"
          $tgz="outputs/codex-usage-monitor-$version.tgz"
          $existing=gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>$null
          if($LASTEXITCODE -eq 0){
            $release=$existing|ConvertFrom-Json
            if($release.isDraft){throw 'An unpublished draft exists; inspect its assets before retrying'}
            foreach($name in @("CodexUsageMonitor-$version-win-x64.zip","CodexUsageMonitor-$version-win-x64.sha256","codex-usage-monitor-$version.tgz","codex-usage-monitor-$version.tgz.sha256")){
              if(-not ($release.assets|Where-Object {$_.name -ceq $name -and $_.state -eq 'uploaded'})){throw ('Existing release is missing an asset: '+$name)}
            }
            Write-Output 'This version is already published with all assets. Leaving it unchanged.'
            exit 0
          }
          gh release create $tag $zip ($zip.Replace('.zip','.sha256')) $tgz ($tgz+'.sha256') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Codex Usage Monitor $version" --notes-file CHANGELOG.md --draft
          if($LASTEXITCODE -ne 0){throw 'Release upload failed; inspect any draft before retrying'}
          Write-Output 'Draft ready. Verify the signed packages on Windows 11 before publishing.'
